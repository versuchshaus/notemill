<!doctype html>
<html lang="en" class="lr-extension-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a save folder — Notemill</title>
    <script src="ui-theme.js"></script>
    <link rel="stylesheet" href="css/extension.css">
  </head>
  <body class="picker">
    <main>
      <div class="card">
        <h1>Where should Notemill save?</h1>
        <p class="hint">Pick a folder once. Every article goes there in its own subfolder
          with its images, until you choose a different one.</p>
        <div class="actions">
          <button type="button" id="choose" class="primary" autofocus>Choose folder…</button>
          <button type="button" id="cancel">Cancel</button>
        </div>
        <p id="state" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script src="folder.js"></script>
    <script src="pick.js"></script>
  </body>
</html>
